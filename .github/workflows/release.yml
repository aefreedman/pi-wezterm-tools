name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: npm install --global npm@11.5.1
      - run: npm --version
      - name: Verify selected tag is the package version tag
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${version}"
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "$(git rev-parse HEAD)"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm pack --dry-run --json
      - name: Reconcile immutable npm identity
        id: identity
        run: node .github/scripts/npm-identity.mjs before
      - name: Publish and verify immutable identity
        if: steps.identity.outputs.publish == 'true'
        run: |
          # A failed response may follow a successful publication. Never blindly retry.
          if npm publish --access public; then
            echo "Publish returned success; checking registry identity."
          else
            echo "Publish returned failure; checking for partial success."
          fi
          node .github/scripts/npm-identity.mjs after
